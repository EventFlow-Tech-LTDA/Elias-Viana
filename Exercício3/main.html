<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventFlow</title>

    <!-- css -->
    <style> 
        .botao {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!--cabeçalho-->
    <h1>Projeto em HTML</h1>
    
    <!--Formulário-->
    <form onsubmit="exibirMensagem(event)">
        <div>
            <label>Digite seu nome:</label>
            <input type="text" id="nome" placeholder="Seu nome" required>
        </div>
        <button class="botao" type="submit">Enviar</button> <!-- foi criado uma classe para mudar o estilo do ponteiro quando passa no botão -->
    </form>

    <p id="resultado"></p>

    <script>
        function exibirMensagem(event) {
            event.preventDefault(); // evita da página recarregar
            const nome = document.getElementById('nome').value; // pega o texto do usuário escrito no input
            const resultado = document.getElementById('resultado'); // seleciona o parágrafo onde a mensagem será exibida

            resultado.textContent = `Olá, ${nome}! Seja bem-vindo(a) ao EventFlow.`; // cria e exibi a mensagem na tela
        }
    </script>
</body>
</html>
