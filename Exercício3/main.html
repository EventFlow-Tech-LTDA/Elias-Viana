<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventFlow</title>
</head>
<body>
    <!--cabeçalho-->
    <h1>Projeto em HTML</h1>
    
    <!--Formulário-->
    <form onsubmit="exibirMensagem(event)" method="post">
        <div>
            <label>Digite seu nome:</label>
            <input type="text" id="nome" placeholder="Seu nome" required>
        </div>
        <button type="submit">Enviar</button>
    </form>

    <p id="resultado"></p>

    <script>
        function exibirMensagem(event) {
            event.preventDefault(); // evita da página recarregar
            const nome = document.getElementById('nome').value;
            const resultado = document.getElementById('resultado');

            resultado.textContent = `Olá, ${nome}! Seja bem-vindo(a) ao EventFlow.`;
        }
    </script>
</body>
</html>
